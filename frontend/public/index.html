<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Gestión de usuarios</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">GU</span>
      <span class="brand-name">Gestión de usuarios</span>
    </div>

    <h1>Iniciar sesión</h1>
    <p class="muted">Ingresa tus credenciales para continuar.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" autofocus>
        <p id="username-error" class="field-error" hidden></p>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
        <p id="password-error" class="field-error" hidden></p>
      </div>

      <p id="form-error" class="form-error" role="alert" hidden></p>

      <button id="submit-btn" type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
