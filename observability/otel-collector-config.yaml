# OpenTelemetry Collector: recibe OTLP de la app, raspa node-exporter y exporta todo a OpenObserve.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Métricas de infraestructura de la instancia EC2 (RF-05)
  prometheus:
    config:
      scrape_configs:
        - job_name: ec2-node
          scrape_interval: 15s
          static_configs:
            - targets: ["host.docker.internal:9100"]
              labels:
                host: ec2-users-app

processors:
  batch:
    timeout: 5s
  resource:
    attributes:
      - key: deployment.environment
        value: production
        action: upsert

exporters:
  otlphttp/o2:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: "Basic ${env:O2_BASIC_AUTH}"
    tls:
      insecure: true
  otlphttp/o2logs:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: "Basic ${env:O2_BASIC_AUTH}"
      stream-name: app_logs
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/o2]
    metrics:
      receivers: [otlp, prometheus]
      processors: [resource, batch]
      exporters: [otlphttp/o2]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/o2logs]
